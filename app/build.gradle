plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Key de DJI Developer (registrada para mx.com.nexusio.fly). Va en local.properties: DJI_API_KEY=xxxx
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) localPropsFile.withInputStream { localProps.load(it) }

android {
    namespace 'mx.com.nexusio.fly'
    compileSdk 34

    defaultConfig {
        applicationId "mx.com.nexusio.fly"
        minSdk 24
        targetSdk 30
        versionCode 3
        versionName '3.0'

        multiDexEnabled true

        manifestPlaceholders = [DJI_API_KEY: localProps.getProperty('DJI_API_KEY', 'REEMPLAZAR_DJI_API_KEY')]

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a'
        }

        buildFeatures {
            buildConfig = true
        }
    }

    buildFeatures {
        compose = true
    }

    lint {
        abortOnError false
        disable 'ExpiredTargetSdkVersion'
    }

    packagingOptions {
        jniLibs.useLegacyPackaging = true

        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'

        doNotStrip "*/*/libconstants.so"
        doNotStrip "*/*/libdji_innertools.so"
        doNotStrip "*/*/libdjibase.so"
        doNotStrip "*/*/libDJICSDKCommon.so"
        doNotStrip "*/*/libDJIFlySafeCore-CSDK.so"
        doNotStrip "*/*/libdjifs_jni-CSDK.so"
        doNotStrip "*/*/libDJIRegister.so"
        doNotStrip "*/*/libdjisdk_jni.so"
        doNotStrip "*/*/libDJIUpgradeCore.so"
        doNotStrip "*/*/libDJIUpgradeJNI.so"
        doNotStrip "*/*/libDJIWaypointV2Core-CSDK.so"
        doNotStrip "*/*/libdjiwpv2-CSDK.so"
        doNotStrip "*/*/libFlightRecordEngine.so"
        doNotStrip "*/*/libvideo-framing.so"
        doNotStrip "*/*/libwaes.so"
        doNotStrip "*/*/libagora-rtsa-sdk.so"
        doNotStrip "*/*/libc++.so"
        doNotStrip "*/*/libc++_shared.so"
        doNotStrip "*/*/libmrtc_28181.so"
        doNotStrip "*/*/libmrtc_agora.so"
        doNotStrip "*/*/libmrtc_core.so"
        doNotStrip "*/*/libmrtc_core_jni.so"
        doNotStrip "*/*/libmrtc_data.so"
        doNotStrip "*/*/libmrtc_log.so"
        doNotStrip "*/*/libmrtc_onvif.so"
        doNotStrip "*/*/libmrtc_rtmp.so"
        doNotStrip "*/*/libmrtc_rtsp.so"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // DJI SDK Core & Network
    implementation "com.dji:dji-sdk-v5-aircraft:5.18.0"
    compileOnly "com.dji:dji-sdk-v5-aircraft-provided:5.18.0"
    runtimeOnly "com.dji:dji-sdk-v5-networkImp:5.18.0"

    // DJI UX SDK Módulo local
    implementation project(':android-sdk-v5-uxsdk')

    // AndroidX & UI
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.constraintlayout.compose
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Splash de Nexus (Jetpack Compose)
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013' // org.json real para tests JVM (en Android viene en el sistema)
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    // Coroutines para MissionPort (flightcore)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}

configurations.all {
    resolutionStrategy {
        force 'androidx.activity:activity:1.8.2'
        force 'androidx.activity:activity-ktx:1.8.2'
        force 'androidx.core:core:1.12.0'
        force 'androidx.core:core-ktx:1.12.0'
        force 'androidx.annotation:annotation-experimental:1.3.1'
        force 'androidx.profileinstaller:profileinstaller:1.3.1'
        force 'androidx.compose.runtime:runtime-annotation-android:1.5.0'
    }
}